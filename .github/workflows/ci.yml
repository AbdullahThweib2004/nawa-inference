name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Release (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # let the other compiler finish even if one fails
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DENABLE_TESTS=ON
          -DENABLE_BENCHMARKS=ON
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      # Benchmarks are compiled (so they can't silently break) but never run here: timings on
      # shared CI machines are noise. Record results locally (docs/performance.md).
      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Debug + ASan/UBSan (gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      # Newer kernels use more address-space randomization bits than ASan
      # supports, which makes sanitized programs crash at startup. Lowering
      # the setting is the standard workaround.
      - name: Adjust ASLR for AddressSanitizer
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DENABLE_TESTS=ON
          -DENABLE_SANITIZERS=ON
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          # Make UBSan findings fail the test instead of only printing a warning.
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  tsan:
    name: ThreadSanitizer (clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang

      # Same kernel setting as for ASan: newer kernels randomize more address bits than the
      # sanitizer runtimes support.
      - name: Adjust ASLR for ThreadSanitizer
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DENABLE_TSAN=ON
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build build

      - name: Test (data races fail the job)
        env:
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
        run: ctest --test-dir build --output-on-failure

  python-format:
    name: Python format + export check (numpy only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Deliberately no torch: the format module and the verification script must work
      # with numpy alone, against the committed model and fixtures.
      - name: Install numpy and pytest
        run: python -m pip install "numpy>=1.24" "pytest>=7.0"

      - name: Format tests
        run: python -m pytest python/tests -v

      - name: Verify committed model against PyTorch fixtures
        run: python python/verify_export.py
